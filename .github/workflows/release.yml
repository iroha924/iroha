# WP-11c release workflow. Human-initiated only (`workflow_dispatch`): plan §7
# makes publishing npm / GitHub Release artifacts a human-authorized action, so
# this never runs on push and never publishes automatically. The default is a
# dry run — it builds the publishable package and produces the tarball,
# checksums, SBOM, and build-provenance attestation, but does NOT publish. Set
# `publish: true` to actually publish to npm and create the GitHub Release.
#
# Verified locally before merge: `pnpm build`, `pnpm --filter @iroha/plugin
# build:release`, `npm pack`, and the version-consistency check all run and
# produce the expected tarball (see release-pack.test.ts). The npm-publish and
# GitHub-Release steps are gated behind `publish: true` and cannot be exercised
# in CI (no real registry publish) — they run for the first time at a real,
# human-authorized release (ci-discipline).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, must equal the built package version (e.g. 0.1.0)"
        required: true
        type: string
      publish:
        description: "Publish to npm and create a GitHub Release (default: dry run only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance + build-provenance attestation
  attestations: write # actions/attest-build-provenance

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Assemble the publishable package
        run: pnpm --filter @iroha/plugin build:release

      - name: Validate the publishable package
        # publint (packaging correctness) + attw (type resolution) on the
        # assembled release, before it is packed and published. Same check as
        # CI's package-check job, minus the rebuild (release is already built).
        run: pnpm run check:package:validate

      - name: Verify version consistency
        env:
          VERSION: ${{ inputs.version }}
        run: |
          built="$(node -p "require('./packages/plugin/release/package.json').version")"
          if [ "$built" != "$VERSION" ]; then
            echo "::error::requested version $VERSION != built package version $built"
            exit 1
          fi

      - name: Pack the tarball
        working-directory: packages/plugin/release
        run: npm pack

      - name: Generate SHA-256 checksums
        working-directory: packages/plugin/release
        run: sha256sum ./*.tgz > checksums.txt

      # SBOM via npm's built-in generator — no third-party action runs with this
      # job's elevated (id-token/contents) permissions (ai-agent-security).
      # `--ignore-scripts` avoids dependency postinstall execution.
      - name: Generate SBOM
        working-directory: packages/plugin/release
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cyclonedx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: packages/plugin/release/*.tgz

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iroha-release-${{ inputs.version }}
          path: |
            packages/plugin/release/*.tgz
            packages/plugin/release/checksums.txt
            packages/plugin/release/sbom.cyclonedx.json

      - name: Ensure npm supports trusted publishing
        # OIDC trusted publishing needs npm >= 11.5.1, and Node 24's bundled npm
        # can be older. Pinned (not @latest) so the publish path — which never
        # runs in CI — can't silently pick up an untested npm; bump deliberately.
        if: ${{ inputs.publish }}
        run: npm install -g npm@11.5.1

      - name: Publish to npm
        if: ${{ inputs.publish }}
        working-directory: packages/plugin/release
        # Trusted publishing (OIDC): npm authenticates via this job's id-token and
        # auto-generates provenance — no NPM_TOKEN, no --provenance flag. The
        # package is already public, so --access is unnecessary. The trusted
        # publisher is configured on npm for org iroha924 / repo iroha / this
        # workflow file (release.yml).
        run: npm publish

      - name: Create GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            packages/plugin/release/*.tgz \
            packages/plugin/release/checksums.txt \
            packages/plugin/release/sbom.cyclonedx.json \
            --title "iroha v$VERSION" \
            --generate-notes
