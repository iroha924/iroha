# Dependabot keeps npm dependencies and GitHub Actions current. Updates are
# grouped so a solo maintainer gets a few consolidated PRs, not a flood; major
# bumps still arrive as their own PRs so they get a careful look.
version: 2
updates:
  # pnpm workspace (npm ecosystem). Dependabot reads the root manifests, the
  # catalog in pnpm-workspace.yaml, and pnpm-lock.yaml across the monorepo.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Actions used in .github/workflows. Pairs with SHA-pinning: Dependabot bumps
  # the pinned commit SHA and updates the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
