# osv-scanner ignore list. Each entry records why a detected advisory is not
# actionable for this repo, and an expiry that forces periodic re-evaluation.

[[IgnoredVulns]]
id = "GHSA-qwww-vcr4-c8h2"
ignoreUntil = 2027-01-25
# CSRF in react-router's unstable RSC (React Server Components) mode only —
# "only affects your application if you are using the unstable RSC APIs".
# apps/dashboard is a client-only SPA (BrowserRouter/Routes/Link, Vite build
# served as static files by the Hono server) that uses no RSC/data-mode APIs,
# so this is unreachable. No 7.x fix exists: react-router-dom is frozen at
# 7.18.1 (no 8.x published) and the fix ships only in react-router 8.3.0, which
# requires migrating off react-router-dom to react-router v8. Re-evaluate at
# expiry (has the dashboard moved to v8, or a 7.x-compatible fix appeared).
reason = "react-router GHSA-qwww-vcr4-c8h2 is RSC-mode-only; the dashboard is a client SPA with no RSC usage, so it is unreachable. No 7.x fix exists."

[[IgnoredVulns]]
id = "GHSA-q8mj-m7cp-5q26"
ignoreUntil = 2027-07-25
# qs remotely-triggerable DoS in qs.stringify (fixed 6.15.2), reached only through
# **verdaccio** — a devDependency backing the local `pnpm release:smoke` registry
# (see `.claude/rules/dev-tooling.md`). verdaccio is never in the published
# `@irohalabs/iroha` artifact (bin-only) and never runs in CI (release:smoke is
# local-only); locally it is a loopback registry serving our own artifact plus an
# npmjs proxy, so the DoS takes no attacker input.
#
# No version bump clears it. verdaccio 6.9.0 pins `express: 4.22.2` (which wants
# `qs ~6.15.1`, patched), but it also pins `@verdaccio/middleware: 8.1.0`, and
# that package pins `express: 4.22.1` exactly — which wants `qs ~6.14.0` and so
# holds 6.14.2 in the tree. `@verdaccio/middleware@8.1.0` is the latest release,
# so the old express is not bumpable from here. Forcing qs across the 6.14→6.15
# minor with an override was rejected: it would trade this ignore for a
# resolution risk inside express's own parser, on a path already unreachable.
reason = "qs DoS reachable only through verdaccio (devDependency, local release:smoke registry); not in any shipped or CI-run code, and no in-range fix exists (@verdaccio/middleware@8.1.0, the latest, pins express 4.22.1 which pins qs ~6.14.0)."
