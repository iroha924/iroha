[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2027-07-25
# uuid missing buffer-bounds check in v3/v5/v6 (fixed 11.1.1), pulled by
# verdaccio. IDs are internally generated, not attacker-controlled. The only fix
# is uuid v8→v11 (a major jump), which is not forced to avoid breaking verdaccio.
reason = "uuid bounds bug reachable only through verdaccio (devDependency, local release:smoke registry); not in any shipped or CI-run code, and no in-range (v8) fix exists."
