[files]
# typos skips hidden paths by default, which silently excluded all of `.claude/**`
# and `.github/**` — 30 files, and the largest English prose corpus in this repo
# outside `docs/` (see .claude/rules/distributable-language.md). That gap applied
# to CI's docs-lint job too, so nothing checked them. Git internals are not prose,
# so `.git/` is excluded explicitly; without it the walk picks up ~682 files there.
ignore-hidden = false
extend-exclude = [".git/"]

# An ALL-CAPS token with a lowercase plural `s` is split before the final capital
# and the prefix matched against the dictionary, so the correct word `CHECKs` is
# reported as a typo of `CHECK` on `CHEC`. Suppressing the split also skips a
# genuine all-caps typo ending in `s`; every finding of this shape here was false.
[default]
extend-ignore-re = ["\\b[A-Z]{2,}s\\b"]

# typos (crate-ci/typos) configuration.
# Rule reference: https://github.com/crate-ci/typos
#
# Allowlist of tokens that look like typos but are intentional: iroha's token
# prefixes, hyphenated compounds, accepted spelling variants, and deliberate
# test-fixture identifiers. Map each word to itself to accept it as correct.
[default.extend-words]
# `ist_…` is iroha's launch/session token prefix (pervasive in tests/fixtures).
ist = "ist"
# `kno_…` is the typed-id prefix for a knowledge entity (see `ID_PREFIXES`); every
# typed-id prefix is a fixed three-or-four-letter token, not prose.
kno = "kno"
# `mis-parsing`, `mis-window(ing)` — a hyphen split leaves a bare "mis".
mis = "mis"
# "unparseable" is an accepted variant spelling (alongside "unparsable").
unparseable = "unparseable"
# `sherif` is the monorepo package.json linter (not the word "sheriff").
sherif = "sherif"
# `knip` is the unused-code/dependency finder.
knip = "knip"
# `publint` (package linter) and `attw` (@arethetypeswrong/cli) are tool names.
publint = "publint"
attw = "attw"
# `semgrep` is the static-analysis tool.
semgrep = "semgrep"
# Deliberate test-fixture strings, not prose typos:
missng = "missng"   # a fixed-width "missing" marker inside a synthetic entity id
tbe = "tbe"         # a turn-id seed in a storage repository test
caf = "caf"         # "Café" assembled via String.fromCharCode in an NFC/NFD test
