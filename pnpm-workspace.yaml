packages:
  - apps/*
  - packages/*

catalogMode: strict
sharedWorkspaceLockfile: true
disallowWorkspaceCycles: true
saveWorkspaceProtocol: rolling

catalog:
  ajv: 8.20.0
  ajv-formats: 3.0.1
  # @iroha/cli terminal rendering: ansis for truecolor (the brand palette is hex,
  # which 16-colour libraries cannot express); string-width because a CJK glyph is
  # one `.length` but two terminal cells, so column alignment needs real widths.
  ansis: 4.3.1
  "@arethetypeswrong/cli": 0.18.5
  "@biomejs/biome": 2.5.5
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  # @iroha/forge-github (WP-12): octokit GraphQL stack + typed codegen
  "@graphql-codegen/cli": 7.2.0
  "@graphql-codegen/typed-document-node": 7.1.0
  "@graphql-codegen/typescript": 6.1.0
  "@graphql-codegen/typescript-operations": 6.1.2
  "@graphql-typed-document-node/core": 3.2.0
  "@octokit/core": 7.0.6
  "@octokit/graphql-schema": 15.26.1
  "@octokit/plugin-paginate-graphql": 6.0.0
  "@octokit/plugin-retry": 8.1.0
  "@octokit/plugin-throttling": 11.0.3
  "@hono/node-server": 2.0.11
  # @iroha/api dashboard routes: OpenAPI 3.1 generation + request validation from
  # the existing Zod schemas. Bundles @hono/zod-validator, so it is the only
  # direct dep needed (validator is used transitively by `.openapi()` routes).
  "@hono/zod-openapi": 1.5.1
  "@libsql/client": 0.17.4
  "@modelcontextprotocol/sdk": 1.30.0
  "@playwright/test": 1.61.1
  "@secretlint/node": 13.0.4
  "@secretlint/secretlint-rule-pattern": 13.0.4
  "@secretlint/secretlint-rule-preset-recommend": 13.0.4
  "@size-limit/file": 13.0.1
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.101.4
  "@testing-library/jest-dom": 7.0.0
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.1
  "@types/node": 24.13.3
  "@types/picomatch": 4.0.3
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@vitejs/plugin-react": 6.0.4
  "@xyflow/react": 12.11.2
  czg: 1.13.1
  fast-check: 4.9.0
  graphql: 16.14.2
  gunshi: 0.37.1
  hono: 4.12.32
  jsdom: 30.0.1
  knip: 6.29.0
  lefthook: 2.1.10
  markdownlint-cli2: 0.23.1
  mdast-util-from-markdown: 2.0.3
  mdast-util-to-string: 4.0.0
  picomatch: 4.0.5
  publint: 0.3.22
  react: 19.2.8
  react-dom: 19.2.8
  react-markdown: 10.1.0
  react-router-dom: 7.18.1
  remark-gfm: 4.0.1
  secretlint: 13.0.4
  sherif: 1.13.0
  size-limit: 13.0.1
  string-width: 8.2.2
  tailwindcss: 4.3.3
  taze: 19.16.0
  ts-pattern: 5.9.0
  tsdown: 0.22.14
  typescript: 7.0.2
  unist-util-visit: 5.1.0
  verdaccio: 6.9.0
  vite: 8.1.5
  vitest: 4.1.10
  yaml: 2.9.0
  zod: 4.4.3
  zx: 8.8.5
  # apps/dashboard shadcn/ui: Base UI primitives + cva/clsx/tailwind-merge, Lucide icons,
  # the shadcn CLI (dev-only), tw-animate-css keyframes, the Calendar/Chart deps
  # (react-day-picker + date-fns, recharts), and the Command palette (cmdk).
  "@base-ui/react": 1.6.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  cmdk: 1.1.1
  date-fns: 4.4.0
  lucide-react: 1.26.0
  react-day-picker: 10.0.1
  recharts: 3.10.0
  shadcn: 4.14.1
  tailwind-merge: 3.6.0
  tw-animate-css: 1.4.0

allowBuilds:
  # lefthook's postinstall only runs `lefthook install -f`, using the
  # prebuilt binary resolved from a normal, checksum-verified
  # optionalDependency (lefthook-<os>-<arch>) — no network fetch at
  # install time. Same trust model as @biomejs/cli-* / esbuild binaries.
  lefthook: true

# No `minimumReleaseAge` here on purpose. pnpm applies no release-age floor to
# this workspace, so `pnpm install` accepts a version published minutes ago; the
# only age policy is `minimumReleaseAge` in `.github/renovate.json`, which delays
# when Renovate *proposes* a bump and does not constrain a hand-written one. A
# `minimumReleaseAgeExclude` list lived here for five months with no parent key to
# exclude from, and every entry in it was inert (#198) — do not re-add exclusions
# without adding the floor they exempt packages from.

# Security overrides for transitive dependencies with no in-range upstream fix
# (osv-scanner runs fail-on-vuln). Each is forced to a patched version; the reason
# is recorded per entry, so an entry with no note below has none recorded:
#   - fast-uri 3.1.3 (GHSA-v2hh-gcrm-f6hx) is pulled transitively via ajv; 3.1.4
#     is a semver-compatible patch.
#   - js-yaml 5.2.1 (GHSA-pm4m-ph32-ghv5) is pulled by markdownlint-cli2 (whose
#     latest, 0.23.1, pins it); 5.2.2 is the patch. Scoped to 5.2.1 so the
#     unrelated 3.x/4.x js-yaml still in the tree keep their own major.
overrides:
  fast-uri: 3.1.4
  brace-expansion: 5.0.8
  "js-yaml@5.2.1": 5.2.2
