# Gemini Code Assist for GitHub — per-repository configuration.
# Schema: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
#
# The review standard itself is not here: it is `.gemini/styleguide.md`, which
# defers to `AGENTS.md` so this repository holds one bar for every AI reviewer
# rather than a second one that drifts.

# No poems or jokes in the summary. The repo's writing rules ban emoji and
# decorative prose; a reviewer's output is held to the same bar.
have_fun: false

code_review:
  disable: false

  # Report everything, including LOW. Most of what this project has actually
  # shipped as a defect was not dramatic — a silently skipped migration, a
  # summary cut at the wrong boundary, a fix that generalized badly to a sibling
  # call site. Those land as LOW/MEDIUM, and the default MEDIUM floor would hide
  # a third of them. Noise is cheaper than a missed finding: triage discipline
  # (`.claude/rules/code-review-triage.md`) is what keeps the volume survivable —
  # read every finding, fix by an explicit standard, record the rejections.
  comment_severity_threshold: LOW

  # Unlimited. A cap silently truncates, and a truncated review reads exactly
  # like a clean one — the same failure mode this repo fixed on its own Doctor
  # page. If a diff draws hundreds of comments, that is a signal about the diff.
  max_review_comments: -1

  pull_request_opened:
    # An independent account of what the diff does, derived from the diff rather
    # than from the author's description. `AGENTS.md` records why that
    # independence matters: framing an LLM reviewer with benign-sounding PR
    # metadata measurably suppresses its findings (arXiv:2603.18740), and most
    # PRs here are authored by an agent that also writes the description.
    summary: true
    code_review: true
    help: false
    # A draft is unfinished by definition. Review it when it is marked ready.
    include_drafts: false

ignore_patterns:
  # A lockfile diff is machine-generated and thousands of lines; dependency
  # changes are judged from `pnpm-workspace.yaml`'s catalog and the manifests,
  # which stay in scope. Supply-chain checks are CI's job (osv-scanner, Trivy,
  # Renovate's minimumReleaseAge), not a reviewer's.
  - pnpm-lock.yaml
